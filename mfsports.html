<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MF SPORTS - Valentín Sánchez</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--r:#CC0000;--rb:#FF2222;--b:#080808;--b2:#0f0f0f;--w:#F0F0F0;--g:#777;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--b);color:var(--w);font-family:'Barlow',sans-serif;overflow-x:hidden;cursor:none;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:52px 52px;}

/* CURSOR */
#cd,#cr{position:fixed;border-radius:50%;pointer-events:none;z-index:999999;top:0;left:0;will-change:transform;}
#cd{width:10px;height:10px;background:#ff0000;box-shadow:0 0 12px 4px rgba(255,0,0,.9),0 0 30px 8px rgba(204,0,0,.5);transition:width .15s,height .15s,background .15s;}
#cr{width:38px;height:38px;border:2px solid rgba(204,0,0,.85);box-shadow:0 0 10px rgba(204,0,0,.3);transition:width .25s cubic-bezier(.16,1,.3,1),height .25s cubic-bezier(.16,1,.3,1),border-color .2s;}
#cd.hov{width:7px;height:7px;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.6);}
#cr.hov{width:58px;height:58px;border-color:rgba(255,255,255,.35);}
.trp{position:fixed;border-radius:50%;pointer-events:none;z-index:999990;top:0;left:0;will-change:transform;}

/* NOISE */
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:99990;opacity:.28;}

/* SECTION BASE */
section{padding:110px 64px;}
.sl{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:6px;text-transform:uppercase;color:var(--r);display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.sl::before{content:'';width:22px;height:1px;background:var(--r);}
.st{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,6.5vw,90px);line-height:.93;margin-bottom:58px;}
.st em{color:var(--r);font-style:normal;}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:20px;left:20px;color:var(--w);text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;">← VOLVER</a>
<section id="project">
  <div class="sl">Proyecto</div>
  <h2 class="st">MF SPORTS</h2>
  <p style="font-size:1.1rem;line-height:1.8;color:rgba(240,240,240,.8);margin-bottom:40px;">Camisetas, musculosas y buzos para fútbol y hockey.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;">
    <img src="mfsports-1.jpg" alt="MF SPORTS photo 1" style="width:100%;height:auto;border:1px solid rgba(255,255,255,.1);">
    <img src="mfsports-2.jpg" alt="MF SPORTS photo 2" style="width:100%;height:auto;border:1px solid rgba(255,255,255,.1);">
    <video controls style="width:100%;height:auto;border:1px solid rgba(255,255,255,.1);">
      <source src="mfsports.mp4" type="video/mp4">
      Tu navegador no soporta el elemento video.
    </video>
  </div>
</section>
</body>
</html>
